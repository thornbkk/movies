    // ==========================================
    // 🧠 3. AUTO-DETECT ENGINE (จากชื่อไฟล์)
    // ==========================================
    function cleanFilename(filename) {
        let name = filename.replace(/\.[^.]+$/, ''); // ตัดนามสกุล
        name = name.replace(/\.(1080p|720p|2160p|4k|HD|FHD|BluRay|WEB-DL|WEBRip|x264|x265|HEVC|DD2\.0|DD5\.1|H\.264|H\.265|LMNTRY|goodS|TELESYNC|TS|CAM|HDTS|AC3|AAC|EN|TH|THAI|ENGLISH)/gi, ' ');
        name = name.replace(/[\.\-_]/g, ' ');
        name = name.replace(/\s{2,}/g, ' ');
        name = name.replace(/\d{4}/g, ''); // ตัดปี
        return name.trim().toLowerCase();
    }

    function detectMovie(filename) {
        const cleanName = cleanFilename(filename);
        let bestMatch = null;
        let bestScore = 0;

        for (const [key, value] of Object.entries(MOVIE_DB)) {
            // ตรวจสอบว่าคีย์อยู่ในชื่อไฟล์ที่ทำความสะอาดแล้ว
            if (cleanName.includes(key)) {
                // ยิ่งคีย์ยาว = ความแม่นยำสูง
                const score = key.length;
                if (score > bestScore) {
                    bestScore = score;
                    bestMatch = { key, ...value };
                }
            }
        }

        // ถ้าไม่เจอ แต่มีคำว่า spiderman หรือ avengers ให้ fallback
        if (!bestMatch) {
            if (cleanName.includes('spider') || cleanName.includes('marvel') || cleanName.includes('avenger')) {
                bestMatch = MOVIE_DB['spider-man'];
            }
        }

        return bestMatch;
    }

    // ==========================================
    // 🔤 4. SMART NAME MAPPING (BUILD FROM DETECTION)
    // ==========================================
    let activeNameMap = {};

    function buildFullNameMap() {
        let fullMap = { ...activeNameMap };
        // เพิ่มชื่อที่ผู้ใช้กำหนดเอง (ถ้ามี) สามารถเพิ่มในอนาคต
        return fullMap;
    }

    function applyNameReplacement(text) {
        if (!text) return text;
        const nameMap = buildFullNameMap();
        let result = text;
        const sortedKeys = Object.keys(nameMap).sort((a, b) => b.length - a.length);
        sortedKeys.forEach(key => {
            const target = nameMap[key];
            const regex = new RegExp('\\b' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
            result = result.replace(regex, target);
        });
        return result;
    }

    // ==========================================
    // 🧠 5. CONTEXT-AWARE "RIGHT" FIXER
    // ==========================================
    function fixRightContext(line) {
        if (!line) return line;
        if (!line.includes('ขวา')) return line;
        if (line.includes('ซ้าย')) return line;
        const directionWords = ['ซ้าย', 'ทิศ', 'ทาง', 'เลี้ยว', 'หัน', 'บ่าย', 'เบี่ยง', 'ข้าง'];
        if (directionWords.some(w => line.includes(w))) return line;
        if (/^\s*ขวา\s*(ครับ|ค่ะ)?\s*[.!?]?\s*$/i.test(line)) return line.replace(/ขวา/, 'ใช่');
        if (/\?.*ขวา/.test(line)) return line.replace(/ขวา/, 'ใช่');
        if (/(คือ|ว่า|ก็|เลย|นะ)\s*ขวา\s*[.!?]?$/.test(line)) return line.replace(/(คือ|ว่า|ก็|เลย|นะ)\s*ขวา/, '$1 ใช่');
        const wordCount = line.split(/\s+/).length;
        if (line.length < 25 && wordCount <= 5 && !line.includes('?') && !line.includes('!')) return line.replace(/ขวา/, 'ใช่');
        if (/^ขวา\s*[,.]/.test(line)) return line.replace(/ขวา/, 'ใช่');
        return line;
    }

            { bad: /^\s*อันดับที่\s*([.?!]*)\s*$/g, good: "ไม่$1" },
            { bad: /^ขวา$/gi, good: "ใช่" },
            { bad: /^\s*ขวา\s*[.!?]?$/gi, good: "ใช่" }
        ]
    };

    function autoCleanSubtitleText(text) {
        if (!text) return text;
        let lines = text.split('\n');
        let cleanedLines = lines.map(line => {
            line = line.replace(/เถอะ\s*ค่ะ/gi, 'เถอะ');
            line = line.replace(/ได้โปรด\s*ค่ะ/gi, 'ได้โปรด');
            line = line.replace(/ขอร้องล่ะ\s*ค่ะ/gi, 'ขอร้องล่ะ');
            line = line.replace(/นะ\s*ค่ะ/gi, 'นะ');
            line = line.replace(/นะ\s*คะ/gi, 'นะ');
            line = line.replace(/^(ไม่|อย่า|หยุด|ได้โปรด|ช่วยด้วย|พระเจ้า|โอ้|แย่ล่ะ)(?:\s*(?:ค่ะ|คะ|ครับ|นะครับ))+([!.]*)/gi, '$1$2');
            if (line.includes('!') || line.includes('?')) {
                line = line.replace(/ค่ะ([!,.?\s]|$)/g, '$1');
                line = line.replace(/คะ([!,.?\s]|$)/g, '$1');
                line = line.replace(/นะคะ([!,.?\s]|$)/g, '$1');
                line = line.replace(/นะค่ะ([!,.?\s]|$)/g, '$1');
            }
            line = line.replace(/[ \t]+/g, ' ').trim();
            line = fixRightContext(line);
            line = applyNameReplacement(line);
            return line;
        });
        return cleanedLines.join('\n');
    }

    // ==========================================
    // 🖱️ 7. DRAG & DROP + FILE LOAD
    // ==========================================
    window.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); });
    window.addEventListener('drop', (e) => { e.preventDefault(); e.stopPropagation(); });
    dropzone.addEventListener('dragenter', (e) => {
        e.preventDefault(); e.stopPropagation();
        dragCounter++;
        dropzone.style.borderColor = '#2563eb';
        dropzone.style.background = '#f0f9ff';
    });
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); });
    dropzone.addEventListener('dragleave', (e) => {
        e.preventDefault(); e.stopPropagation();
        dragCounter--;
        if (dragCounter === 0) {
            dropzone.style.borderColor = '#38bdf8';
            dropzone.style.background = '#f8fafc';
        }
    });
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault(); e.stopPropagation();
        dragCounter = 0;
        dropzone.style.borderColor = '#38bdf8';
        dropzone.style.background = '#f8fafc';
        if (e.dataTransfer.files.length > 0) processSelectedFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) processSelectedFile(e.target.files[0]);
    });

    function processSelectedFile(file) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (!['srt', 'ass', 'ssa', 'vtt'].includes(ext)) {
            alert('⚠️ รองรับเฉพาะ .srt, .ass, .ssa, .vtt เท่านั้น');
            return;
        }
        selectedFile = file;
        fileExtension = ext;
        
        // 🔥 ตรวจจับหนังจากชื่อไฟล์
        const movieData = detectMovie(file.name);
        activeNameMap = (movieData && movieData.nameMap) ? movieData.nameMap : {};
        
        // อัพเดท UI
        if (movieData) {
            detectionStatus.style.display = 'flex';
            detectedMovieName.textContent = file.name.split('.').slice(0,3).join(' '); // แสดงชื่อคร่าวๆ
            detectedGenre.textContent = movieData.genre || 'Unknown';
            const count = Object.keys(activeNameMap).length;
            detectedCharCount.textContent = count + ' ตัวละคร';
            detectedMovieTitle = file.name;
        } else {
            detectionStatus.style.display = 'flex';
            detectedMovieName.textContent = file.name;
            detectedGenre.textContent = 'Generic (Fallback)';
            detectedCharCount.textContent = '0 (ใช้ทับศัพท์อัตโนมัติ)';
            // Fallback: แมปชื่อสามัญ
            activeNameMap = {
                'jean': 'จีน', 'peter': 'ปีเตอร์', 'bruce': 'บรูซ', 'tony': 'โทนี่',
                'steve': 'สตีฟ', 'natasha': 'นาตาชา', 'frank': 'แฟรงค์', 'thor': 'ธอร์'
            };
            detectedMovieTitle = file.name;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            rawFileContent = e.target.result;
            fileNameDisplay.innerHTML = `📄 ${selectedFile.name}`;
            document.getElementById('progressContainer').style.display = 'block';
            btnTranslate.removeAttribute('disabled');
            btnTranslate.classList.add('active');
            statusText.textContent = movieData ? `✅ ตรวจพบหนัง: ${movieData.genre} (ใช้ชื่อตามเสียง) ` : "⚠️ ตรวจจับไม่ได้ ใช้โหมดทับศัพท์พื้นฐาน";
            progressBarFill.style.width = '0%';
            percentageText.textContent = '0%';
        };
        reader.readAsText(selectedFile);
    }

    // ==========================================
    // 🛡️ 8. TAG PROTECTION
    // ==========================================
    function protectTagsAndFix(textArray) {
        return textArray.map(txt => {
            let text = txt.trim();
            if (!text) return { text: "", tags: [] };
            terminologyDict.preTranslate.forEach(rule => text = text.replace(rule.regex, rule.replace));
            let currentTags = [];
            text = text.replace(/\\N/g, ' [[BR_ASS_N]] ');
            text = text.replace(/\\n/g, ' [[BR_ASS_LOWER]] ');
            text = text.replace(/<br\s*\/?>/gi, ' [[BR_HTML]] ');
            text = text.replace(/\r?\n/g, ' [[BR_NEWLINE]] ');
            let tagRegex = /(<\/?[a-zA-Z][^>]*>|\{[^}]+\})/g;
            text = text.replace(tagRegex, function(match) {
                currentTags.push(match);
                return ` [[TAG_${currentTags.length - 1}]] `;
            });
            return { text, tags: currentTags };
        });
    }

    function restoreTagsAndClean(translatedArray, metaTagPairs) {
        return translatedArray.map((txt, index) => {
            let text = txt || "";
            let tags = metaTagPairs[index].tags || [];
            tags.forEach((tag, idx) => {
                let pattern = new RegExp(`\\[\\[\\s*TAG_${idx}\\s*\\]\\]`, 'gi');
                text = text.replace(pattern, tag);
            });
            text = text.replace(/\[\[\s*BR_HTML\s*\]\]/gi, '<br>');
            text = text.replace(/\[\[\s*BR_ASS_N\s*\]\]/gi, '\\N');
            text = text.replace(/\[\[\s*BR_ASS_LOWER\s*\]\]/gi, '\\n');
            text = text.replace(/\[\[\s*BR_NEWLINE\s*\]\]/gi, '\n');
            terminologyDict.postTranslate.forEach(rule => text = text.replace(rule.bad, rule.good));
            text = autoCleanSubtitleText(text);
            text = text.replace(/\s*(<\/?[a-zA-Z][^>]*>|\{[^}]+\})\s*/g, '$1');
            text = text.replace(/ ?<br\s*\/?> ?/gi, '<br>');
            text = text.replace(/ ?\\N ?/g, '\\N');
            text = text.replace(/ ?\\n ?/g, '\\n');
            return text.trim();
        });
    }

    // ==========================================
    // 🌐 9. TRANSLATION ENGINES
    // ==========================================
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function translateWithGoogle(textArray, targetLang, apiKey, signal) {
        let metaPairs = protectTagsAndFix(textArray);
        let preparedTexts = metaPairs.map(p => p.text);
        let rawTranslations = [];
        if (apiKey) {
            let params = new URLSearchParams();
            params.append('key', apiKey);
            params.append('target', targetLang);
            params.append('format', 'text');
            preparedTexts.forEach(t => params.append('q', t || ' '));
            const res = await fetch(`https://translation.googleapis.com/language/translate/v2?${params.toString()}`, { method: 'POST', signal });
            if (!res.ok) throw new Error("Google API Paid Error");
            const data = await res.json();
            rawTranslations = data.data.translations.map(t => t.translatedText);
        } else {
            const batchSize = 3;
            for (let i = 0; i < preparedTexts.length; i += batchSize) {
                if (signal && signal.aborted) throw new DOMException("Aborted", "AbortError");
                const batch = preparedTexts.slice(i, i + batchSize);
                const batchPromises = batch.map(async t => {
                    if (!t) return "";
                    let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(t)}`;
                    try {
                        const res = await fetch(url, { signal });
                        if (!res.ok) return t;
                        const data = await res.json();
                        if (data && data[0]) return data[0].map(x => x[0]).join('');
                        return t;
                    } catch (e) {
                        if (e.name === 'AbortError') throw e;
                        return t;
                    }
                });
                const batchResults = await Promise.all(batchPromises);
                rawTranslations = rawTranslations.concat(batchResults);
                await sleep(100);
            }
        }
        return restoreTagsAndClean(rawTranslations, metaPairs);
    }

    async function translateWithOpenAI(textArray, targetLang, apiKey, signal) {
        let metaPairs = protectTagsAndFix(textArray);
        let preparedTexts = metaPairs.map(p => p.text);
        let chunkText = preparedTexts.map((txt, idx) => `[L_${idx}] ${txt}`).join('\n');
        
        // ดึงข้อมูลหนังที่ตรวจจับได้เพื่อส่งให้ OpenAI
        const movieInfo = detectMovie(selectedFile ? selectedFile.name : '');
        const genreHint = movieInfo ? `Genre: ${movieInfo.genre}. ` : '';
        const toneHint = movieInfo ? `Tone: ${movieInfo.tone}. ` : '';
        const nameHint = movieInfo ? `Character names must be transliterated according to Thai cinema standards for this movie (e.g., Jean -> จีน, Peter -> ปีเตอร์).` : 'Transliterate names phonetically (American English style).';

        const systemPrompt = `You are a veteran cinema subtitle translator.
Movie detected: ${detectedMovieTitle}
${genreHint}${toneHint}
CRITICAL RULES:
1. Translate line-by-line concisely for quick reading.
2. Keep placeholders like "[[TAG_0]]", "[[BR_HTML]]" exactly intact.
3. Use natural movie dialogue phrasing appropriate to the genre.
4. Return ONLY rows matching [L_x].
5. ${nameHint}
6. For the word "Right" when used as agreement/acknowledgment, translate as "ใช่" or "ถูกต้อง" depending on context, NEVER "ขวา".`;

        const res = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
            body: JSON.stringify({
                model: 'gpt-4o',
                messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: chunkText }],
                temperature: 0.35
            }),
            signal
        });
        if (!res.ok) throw new Error("OpenAI Failed");
        const data = await res.json();
        if (data.choices && data.choices[0]) {
            const reply = data.choices[0].message.content;
            let resultList = new Array(textArray.length).fill("");
            reply.split('\n').forEach(line => {
                let match = line.match(/^\[L_(\d+)\]\s*(.*)/);
                if (match) {
                    let idx = parseInt(match[1]);
                    if (idx < resultList.length) resultList[idx] = match[2].trim();
                }
            });
            for (let k = 0; k < resultList.length; k++) {
                if (!resultList[k] && textArray[k]) resultList[k] = "ไม่";
            }
            return restoreTagsAndClean(resultList, metaPairs);
        }
        throw new Error("OpenAI Parsing Error");
    }

    // ==========================================
    // 🚀 10. MAIN PROCESSOR
    // ==========================================
    btnTranslate.addEventListener('click', async function() {
        if (isTranslating) {
            if (abortController) abortController.abort();
            return;
        }
        if (!selectedFile) {
            alert("⚠️ กรุณาเลือกไฟล์ก่อน");
            return;
        }
        const engine = uiEngine.value;
        const key = uiKey.value.trim();
        const targetLang = uiLang.value;
        if (engine === 'openai' && !key) {
            alert("⚠️ ใส่ OpenAI API Key");
            return;
        }

        isTranslating = true;
        abortController = new AbortController();
        btnTranslate.textContent = "❌ ยกเลิก";
        btnTranslate.classList.remove('active');
        btnTranslate.classList.add('cancel-mode');
        statusText.textContent = "กำลังประมวลผล...";

        try {
            const lines = (fileExtension === 'srt' || fileExtension === 'vtt') ? rawFileContent.split(/\r?\n\r?\n/) : rawFileContent.split(/\r?\n/);
            let finalBlocks = [];
            let chunkSize = (engine === 'openai') ? 12 : 15;

            for (let i = 0; i < lines.length; i += chunkSize) {
                if (abortController.signal.aborted) throw new DOMException("Aborted", "AbortError");

                let batch = lines.slice(i, i + chunkSize);
                let textArray = [];
                let meta = [];

                batch.forEach(b => {
                    let trimmed = b.trim();
                    if (trimmed.startsWith('WEBVTT')) { meta.push({ type: 'raw', content: b }); } else if (!trimmed) { meta.push({ type: 'empty' }); } else if (fileExtension === 'srt' || fileExtension === 'vtt') {
                        let l = trimmed.split(/\r?\n/);
                        if (l.length >= 3) {
                            meta.push({ type: 'sub', header: l[0], time: l[1] });
                            textArray.push(l.slice(2).join('\n'));
                        } else { meta.push({ type: 'raw', content: b }); }
                    } else if (fileExtension === 'ass' || fileExtension === 'ssa') {
                        if (trimmed.startsWith('Dialogue:')) {
                            let parts = trimmed.split(',');
                            meta.push({ type: 'ass_dialogue', prefix: parts.slice(0, 9).join(',') });
                            textArray.push(parts.slice(9).join(','));
                        } else { meta.push({ type: 'raw', content: b }); }
                    } else { meta.push({ type: 'raw', content: b }); }
                });

                let translated = [];
                try {
                    if (engine === 'openai') translated = await translateWithOpenAI(textArray, targetLang, key, abortController.signal);
                    else translated = await translateWithGoogle(textArray, targetLang, key, abortController.signal);
                } catch (err) {
                    if (err.name === 'AbortError') throw err;
                    console.error("Fallback to Google", err);
                    translated = await translateWithGoogle(textArray, targetLang, "", abortController.signal);
                }

                let tIdx = 0;
                meta.forEach(m => {
                    if (m.type === 'sub') finalBlocks.push(`${m.header}\n${m.time}\n${translated[tIdx++] || ""}`);
                    else if (m.type === 'ass_dialogue') finalBlocks.push(`${m.prefix},${translated[tIdx++] || ""}`);
                    else if (m.type === 'empty') finalBlocks.push("");
                    else finalBlocks.push(m.content);
                });

                let pct = Math.min(Math.floor(((i + batch.length) / lines.length) * 100), 100);
                progressBarFill.style.width = pct + '%';
                percentageText.textContent = pct + '%';
                statusText.textContent = `กำลังแปล ${i + batch.length} / ${lines.length}...`;
                await sleep(10);
            }

            let finalContent = (fileExtension === 'srt' || fileExtension === 'vtt') ? finalBlocks.join('\n\n') : finalBlocks.join('\n');
            const blob = new Blob([finalContent], { type: "text/plain;charset=utf-8" });
            saveAs(blob, selectedFile.name.replace(/\.[^/.]+$/, "") + "." + targetLang + "." + fileExtension);
            statusText.textContent = "🎉 แปลเสร็จแล้ว! (ตรวจจับหนังอัตโนมัติ)";
            percentageText.textContent = "100%";

        } catch (err) {
            if (err.name === 'AbortError') {
                statusText.textContent = "⚠️ ยกเลิกแล้ว";
                progressBarFill.style.width = '0%';
                percentageText.textContent = '0%';
            } else {
                console.error(err);
                statusText.textContent = "❌ เกิดข้อผิดพลาด";
            }
        } finally {
            isTranslating = false;
            abortController = null;
            btnTranslate.textContent = "เริ่มกระบวนการแปลซับไตเติล";
            btnTranslate.classList.remove('cancel-mode');
            btnTranslate.removeAttribute('disabled');
            btnTranslate.classList.add('active');
        }
    });
</script>

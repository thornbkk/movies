<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubThorn v.2.9.1 (NVIDIA NIM DeepSeek Edition)</title>
    <!-- โหลดไลบรารี FileSaver.js สำหรับบันทึกไฟล์ลงเครื่องคอมพิวเตอร์ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.8/FileSaver.min.js"></script>
    <style>
        /* ==========================================
           🎨 GLOBAL & RESPONSIVE STYLES (ธีม Dark Modern)
           ========================================== */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); 
            color: #f8fafc; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }
        
        .main-container { 
            max-width: 650px; 
            width: 100%; 
            text-align: center; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        
        .main-title { 
            font-family: "Georgia", serif; 
            font-size: clamp(32px, 5vw, 46px); 
            margin: 0 0 5px 0; 
            color: #38bdf8; 
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2); 
        }
        
        .main-version { 
            font-size: 13px; 
            color: #0ea5e9; 
            font-weight: bold; 
            margin-bottom: 25px; 
            letter-spacing: 2px; 
        }
        
        .converter-card { 
            background: #ffffff; 
            color: #1e293b; 
            border-radius: 20px; 
            padding: clamp(20px, 4vw, 35px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
            text-align: left; 
        }
        
        /* Dropzone พื้นที่สำหรับลากและวางไฟล์ */
        .dropzone { 
            border: 2px dashed #38bdf8; 
            background: #f8fafc; 
            border-radius: 14px; 
            padding: 40px 15px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.25s ease; 
            margin-bottom: 20px; 
        }
        
        .dropzone:hover { 
            border-color: #2563eb; 
            background: #f0f9ff; 
        }
        
        /* ฟอร์มและช่องกรอกข้อมูล */
        .form-label { 
            font-size: 13px; 
            color: #475569; 
            font-weight: 700; 
            margin-top: 18px; 
            margin-bottom: 8px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            text-transform: uppercase;
        }
        
        .select-input, .text-input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1px solid #cbd5e1; 
            border-radius: 10px; 
            background: #f1f5f9; 
            box-sizing: border-box; 
            outline: none; 
            font-size: 15px; 
            transition: all 0.2s; 
        }
        
        .select-input:focus, .text-input:focus { 
            border-color: #38bdf8; 
            background: #ffffff; 
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); 
        }
        
        /* Progress Bar และการแสดงผลสถานะ */
        .progress-container { 
            margin-top: 25px; 
            display: none; 
            background: #f8fafc; 
            padding: 15px; 
            border-radius: 10px; 
            border: 1px solid #e2e8f0; 
        }
        
        .file-name-info { 
            font-size: 13px; 
            color: #0284c7; 
            font-weight: bold; 
            margin-bottom: 10px; 
            word-break: break-all; 
        }
        
        .progress-bar-bg { 
            width: 100%; 
            background-color: #e2e8f0; 
            border-radius: 10px; 
            height: 10px; 
            overflow: hidden; 
            margin-top: 8px; 
        }
        
        .progress-bar-fill { 
            width: 0%; 
            height: 100%; 
            background: linear-gradient(90deg, #38bdf8, #2563eb); 
            transition: width 0.2s ease; 
        }
        
        /* ปุ่มเริ่มแปลภาษา / ปุ่มยกเลิก */
        .btn-translate { 
            width: 100%; 
            background: #e2e8f0; 
            color: #94a3b8; 
            border: none; 
            padding: 18px; 
            border-radius: 30px; 
            font-weight: bold; 
            font-size: 16px; 
            margin-top: 25px; 
            cursor: not-allowed; 
            transition: all 0.3s ease; 
        }
        
        .btn-translate.active { 
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%); 
            color: #ffffff; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); 
        }
        
        .btn-translate.active:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); 
        }

        .btn-translate.cancel-mode {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%) !important;
            color: #ffffff !important;
            cursor: pointer !important;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3) !important;
        }

        .btn-translate.cancel-mode:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(225, 29, 72, 0.4) !important;
        }
        
        .engine-note { 
            font-size: 12px; 
            color: #64748b; 
            margin-top: 15px; 
            text-align: center; 
            line-height: 1.5; 
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1 class="main-title">SubThorn Translation</h1>
        <div class="main-version">NVIDIA NIM DEEPSEEK EDITION v.2.9.1</div>
        
        <div class="converter-card">
            <!-- Dropzone Area -->
            <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
                <div style="font-size: 44px; margin-bottom: 12px;">🎬</div>
                <p style="font-weight: 700; color: #334155; margin: 5px 0; font-size: 15px;">แตะเลือกไฟล์ หรือลากไฟล์มาวางที่นี่</p>
                <p style="font-size: 13px; color: #64748b; margin: 5px 0 0 0;">รองรับ .srt, .ass, .ssa, .vtt</p>
                <input type="file" id="fileInput" accept=".srt,.ass,.ssa,.vtt" style="display:none;">
            </div>

            <!-- เลือก AI Engine -->
            <label class="form-label">🤖 เครื่องมือแปลภาษา (Translation Engine)</label>
            <select class="select-input" id="apiEngine">
                <option value="nvidia_deepseek" selected>NVIDIA NIM (DeepSeek V4 Pro)</option>
                <option value="google_free">Google Translate v.2 API / (Free)</option>
                <option value="openai">OpenAI API GPT-4o</option>
            </select>

            <!-- ช่องใส่ API Key -->
            <label class="form-label">🔑 API Key (nvapi-... สำหรับ NVIDIA NIM)</label>
            <input type="password" class="text-input" id="apiKey" placeholder="กรอก API Key (nvapi-... สำหรับ NVIDIA หรือ sk-... สำหรับ OpenAI)">

            <!-- ภาษาเป้าหมาย -->
            <label class="form-label">🎯 แปลงเป็นภาษา</label>
            <select class="select-input" id="targetLang">
                <option value="th" selected>Thai (ภาษาไทย)</option>
                <option value="en">English (ภาษาอังกฤษ)</option>
            </select>

            <!-- ความคืบหน้า Progress Container -->
            <div class="progress-container" id="progressContainer">
                <div class="file-name-info" id="fileNameDisplay"></div>
                <div style="display:flex; justify-content: space-between; font-size:13px; font-weight:700; color:#334155;">
                    <span id="statusText">เตรียมความพร้อม...</span>
                    <span id="percentageText">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
            </div>

            <!-- ปุ่มคำสั่งแปล / ยกเลิก -->
            <button class="btn-translate" id="btnTranslate" disabled>เริ่มกระบวนการแปลซับไตเติล</button>
            <div class="engine-note">🛠️ <b>v.2.9.1:</b> NVIDIA NIM Integration + Tag Protection + Line-Break Preservation</div>
        </div>
    </div>

    <script>
        // ==========================================
        // 📌 1. DOM ELEMENTS & STATE MANAGEMENT
        // ==========================================
        const fileInput = document.getElementById('fileInput');
        const btnTranslate = document.getElementById('btnTranslate');
        const progressBarFill = document.getElementById('progressBarFill');
        const statusText = document.getElementById('statusText');
        const percentageText = document.getElementById('percentageText');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const dropzone = document.getElementById('dropzone');
        
        const uiEngine = document.getElementById('apiEngine');
        const uiKey = document.getElementById('apiKey');
        const uiLang = document.getElementById('targetLang');

        let selectedFile = null;
        let fileExtension = 'srt';
        let rawFileContent = "";
        let dragCounter = 0;

        let abortController = null;
        let isTranslating = false;

        // ==========================================
        // 💾 2. AUTO-SAVE SETTINGS
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('sub_engine')) uiEngine.value = localStorage.getItem('sub_engine');
            if(localStorage.getItem('sub_apikey')) uiKey.value = localStorage.getItem('sub_apikey');
            if(localStorage.getItem('sub_lang')) uiLang.value = localStorage.getItem('sub_lang');
        });

        const saveSettings = () => {
            localStorage.setItem('sub_engine', uiEngine.value);
            localStorage.setItem('sub_apikey', uiKey.value.trim());
            localStorage.setItem('sub_lang', uiLang.value);
        };

        uiEngine.addEventListener('change', saveSettings);
        uiKey.addEventListener('change', saveSettings);
        uiKey.addEventListener('input', saveSettings);
        uiLang.addEventListener('change', saveSettings);

        // ==========================================
        // 🛡️ 3. DEEP AUTO-SMART PARTICLE & TERM CLEANER
        // ==========================================
        const terminologyDict = {
            preTranslate: [
                { regex: /^\s*No\.\s*$/ig, replace: "No" }
            ],
            postTranslate: [
                { bad: /^\s*เลขที่\s*([.?!]*)\s*$/g, good: "ไม่$1" },
                { bad: /^\s*หมายเลข\s*([.?!]*)\s*$/g, good: "ไม่$1" },
                { bad: /^\s*อันดับที่\s*([.?!]*)\s*$/g, good: "ไม่$1" }
            ]
        };

        function autoCleanSubtitleText(text) {
            if (!text) return text;
            
            let lines = text.split('\n');
            let cleanedLines = lines.map(function(line) {
                line = line.replace(/เถอะ\s*ค่ะ/gi, 'เถอะ');
                line = line.replace(/ได้โปรด\s*ค่ะ/gi, 'ได้โปรด');
                line = line.replace(/ขอร้องล่ะ\s*ค่ะ/gi, 'ขอร้องล่ะ');
                line = line.replace(/นะ\s*ค่ะ/gi, 'นะ');
                line = line.replace(/นะ\s*คะ/gi, 'นะ');

                line = line.replace(/^(ไม่|อย่า|หยุด|ได้โปรด|ช่วยด้วย|พระเจ้า|โอ้|แย่ล่ะ)(?:\s*(?:ค่ะ|คะ|ครับ|นะครับ))+([!.]*)/gi, '$1$2');
                
                if (line.includes('!') || line.includes('?')) {
                    line = line.replace(/ค่ะ([!,.?\s]|$)/g, '$1');
                    line = line.replace(/คะ([!,.?\s]|$)/g, '$1');
                    line = line.replace(/นะคะ([!,.?\s]|$)/g, '$1');
                    line = line.replace(/นะค่ะ([!,.?\s]|$)/g, '$1');
                }
                
                return line.replace(/[ \t]+/g, ' ').trim();
            });

            return cleanedLines.join('\n');
        }

        // ==========================================
        // 🖱️ 4. DRAG & DROP UX PROTECTION
        // ==========================================
        window.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); });
        window.addEventListener('drop', (e) => { e.preventDefault(); e.stopPropagation(); });

        dropzone.addEventListener('dragenter', (e) => {
            e.preventDefault(); e.stopPropagation();
            dragCounter++;
            dropzone.style.borderColor = '#2563eb';
            dropzone.style.background = '#f0f9ff';
        });

        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); });

        dropzone.addEventListener('dragleave', (e) => {
            e.preventDefault(); e.stopPropagation();
            dragCounter--;
            if (dragCounter === 0) {
                dropzone.style.borderColor = '#38bdf8';
                dropzone.style.background = '#f8fafc';
            }
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault(); e.stopPropagation();
            dragCounter = 0;
            dropzone.style.borderColor = '#38bdf8';
            dropzone.style.background = '#f8fafc';

            if (e.dataTransfer.files.length > 0) {
                processSelectedFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => { 
            if (e.target.files.length > 0) {
                processSelectedFile(e.target.files[0]); 
            }
        });

        function processSelectedFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            const validExts = ['srt', 'ass', 'ssa', 'vtt'];
            
            if (!validExts.includes(ext)) {
                alert('⚠️ ไม่รองรับไฟล์นี้! กรุณาใช้ไฟล์นามสกุล .srt, .ass, .ssa, หรือ .vtt เท่านั้นครับ');
                return;
            }
            
            selectedFile = file;
            fileExtension = ext;
            const reader = new FileReader();
            
            reader.onload = function(e) {
                rawFileContent = e.target.result;
                fileNameDisplay.innerHTML = `📄 ไฟล์ที่เลือก: ${selectedFile.name}`;
                document.getElementById('progressContainer').style.display = 'block';
                btnTranslate.removeAttribute('disabled');
                btnTranslate.classList.add('active');
                statusText.textContent = "ตรวจสอบโครงสร้างไฟล์และเตรียมระบบ Tag Protection เรียบร้อยครับ";
                
                progressBarFill.style.width = '0%';
                percentageText.textContent = '0%';
            };
            
            reader.readAsText(selectedFile);
        }

        // ==========================================
        // 🛡️ 5. TAG & LINE-BREAK PROTECTION ENGINE (v.2.9.1)
        // ==========================================
        function protectTagsAndFix(textArray) {
            return textArray.map(function(txt) {
                let text = txt.trim();
                
                if (!text) {
                    return { text: "", tags: [] };
                }

                terminologyDict.preTranslate.forEach(function(rule) {
                    text = text.replace(rule.regex, rule.replace);
                });

                let currentTags = [];

                text = text.replace(/\\N/g, ' [[BR_ASS_N]] ');
                text = text.replace(/\\n/g, ' [[BR_ASS_LOWER]] ');
                text = text.replace(/<br\s*\/?>/gi, ' [[BR_HTML]] ');
                text = text.replace(/\r?\n/g, ' [[BR_NEWLINE]] ');

                let tagRegex = /(<\/?[a-zA-Z][^>]*>|\{[^}]+\})/g;
                
                text = text.replace(tagRegex, function(match) {
                    currentTags.push(match);
                    return ` [[TAG_${currentTags.length - 1}]] `;
                });

                return { text: text, tags: currentTags };
            });
        }

        function restoreTagsAndClean(translatedArray, metaTagPairs) {
            return translatedArray.map(function(txt, index) {
                let text = txt || "";
                let tags = metaTagPairs[index].tags || [];

                tags.forEach(function(tag, idx) {
                    let pattern = new RegExp(`\\[\\[\\s*TAG_${idx}\\s*\\]\\]`, 'gi');
                    text = text.replace(pattern, tag);
                });

                text = text.replace(/\[\[\s*BR_HTML\s*\]\]/gi, '<br>');
                text = text.replace(/\[\[\s*BR_ASS_N\s*\]\]/gi, '\\N');
                text = text.replace(/\[\[\s*BR_ASS_LOWER\s*\]\]/gi, '\\n');
                text = text.replace(/\[\[\s*BR_NEWLINE\s*\]\]/gi, '\n');

                terminologyDict.postTranslate.forEach(function(rule) {
                    text = text.replace(rule.bad, rule.good);
                });

                text = autoCleanSubtitleText(text);

                text = text.replace(/\s*(<\/?[a-zA-Z][^>]*>|\{[^}]+\})\s*/g, '$1');
                text = text.replace(/ ?<br\s*\/?> ?/gi, '<br>');
                text = text.replace(/ ?\\N ?/g, '\\N');
                text = text.replace(/ ?\\n ?/g, '\\n');

                return text.trim();
            });
        }

        // ==========================================
        // 🌐 6. TRANSLATION ENGINE: GOOGLE TRANSLATE
        // ==========================================
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        async function translateWithGoogle(textArray, targetLang, apiKey, signal) {
            let metaPairs = protectTagsAndFix(textArray);
            let preparedTexts = metaPairs.map(p => p.text);
            let rawTranslations = [];
            
            if (apiKey) {
                let params = new URLSearchParams();
                params.append('key', apiKey);
                params.append('target', targetLang);
                params.append('format', 'text');
                
                preparedTexts.forEach(function(t) {
                    params.append('q', t || ' ');
                });
                
                const res = await fetch(`https://translation.googleapis.com/language/translate/v2?${params.toString()}`, { 
                    method: 'POST',
                    signal: signal 
                });
                
                if (!res.ok) {
                    throw new Error("Google API Paid Error: Invalid Key or Quota Exceeded");
                }
                
                const data = await res.json();
                rawTranslations = data.data.translations.map(t => t.translatedText);
                
            } else {
                const batchSize = 3; 
                
                for (let i = 0; i < preparedTexts.length; i += batchSize) {
                    if (signal && signal.aborted) throw new DOMException("Aborted", "AbortError");

                    const batch = preparedTexts.slice(i, i + batchSize);
                    
                    const batchPromises = batch.map(async function(t) {
                        if (!t) return "";
                        let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(t)}`;
                        try {
                            const res = await fetch(url, { signal: signal });
                            if (!res.ok) return t; 
                            const data = await res.json();
                            if (data && data[0]) {
                                return data[0].map(x => x[0]).join('');
                            }
                            return t;
                        } catch (e) {
                            if (e.name === 'AbortError') throw e;
                            return t;
                        }
                    });
                    
                    const batchResults = await Promise.all(batchPromises);
                    rawTranslations = rawTranslations.concat(batchResults);
                    
                    await sleep(100); 
                }
            }
            
            return restoreTagsAndClean(rawTranslations, metaPairs);
        }

// ==========================================
        // 🟢 7. TRANSLATION ENGINE: NVIDIA NIM (v.2.9.2 CORS Proxy Fix)
        // ==========================================
        async function translateWithNvidia(textArray, targetLang, apiKey, signal) {
            let metaPairs = protectTagsAndFix(textArray);
            let preparedTexts = metaPairs.map(p => p.text);
            
            let chunkText = preparedTexts.map(function(txt, index) {
                return `[L_${index}] ${txt}`;
            }).join('\n');

            const systemPrompt = `You are a professional cinema subtitle translator converting movie dialogue to ${targetLang === 'th' ? 'Thai' : 'English'}.
CRITICAL REQUIREMENTS:
1. Translate line-by-line accurately and naturally for subtitles.
2. Keep ALL placeholder tags like "[[TAG_0]]", "[[BR_HTML]]", "[[BR_NEWLINE]]", "[[BR_ASS_N]]" EXACTLY intact in their original positions.
3. Return ONLY the rows with matching [L_x] prefix format.`;

            // ใช้ CORS Proxy เพื่อแก้ปัญหา "Failed to fetch" บน GitHub Pages
            const targetUrl = 'https://integrate.api.nvidia.com/v1/chat/completions';
            const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

            const res = await fetch(proxyUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'deepseek-ai/deepseek-r1', // หรือใช้นามสกุลโมเดลมาตรฐานที่ NVIDIA ปลดล็อก API Public
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: chunkText }
                    ],
                    temperature: 0.3,
                    max_tokens: 4096
                }),
                signal: signal
            });

            if (!res.ok) {
                const errText = await res.text().catch(() => '');
                throw new Error(`NVIDIA NIM API Error (${res.status}): ${errText || 'Authentication Failed or Invalid Key'}`);
            }

            const data = await res.json();
            
            if (data.choices && data.choices[0]) {
                const reply = data.choices[0].message.content;
                let resultList = new Array(textArray.length).fill("");
                
                const lines = reply.split('\n');
                lines.forEach(function(line) {
                    let match = line.match(/^\[L_(\d+)\]\s*(.*)/);
                    if (match) {
                        let idx = parseInt(match[1]);
                        if (idx < resultList.length) {
                            resultList[idx] = match[2].trim();
                        }
                    }
                });

                for (let k = 0; k < resultList.length; k++) {
                    if (!resultList[k] && textArray[k]) {
                        resultList[k] = textArray[k]; 
                    }
                }
                return restoreTagsAndClean(resultList, metaPairs);
            }
            
            throw new Error("NVIDIA NIM Parsing Error: Empty choice response");
        }

        // ==========================================
        // 🧠 8. TRANSLATION ENGINE: OPENAI GPT-4o
        // ==========================================
        async function translateWithOpenAI(textArray, targetLang, apiKey, signal) {
            let metaPairs = protectTagsAndFix(textArray);
            let preparedTexts = metaPairs.map(p => p.text);
            
            let chunkText = preparedTexts.map(function(txt, index) {
                return `[L_${index}] ${txt}`;
            }).join('\n');

            const systemPrompt = `You are a veteran master cinema subtitle translator converting movie dialogues into Thai naturally based on context.
CRITICAL THEATRICAL CINEMA SUBTITLE GUIDELINES:
1. Translate line-by-line concisely for quick reading.
2. Keep all placeholder tags like "[[TAG_0]]", "[[BR_HTML]]", "[[BR_NEWLINE]]", "[[BR_ASS_N]]" EXACTLY intact in their relative positions.
3. Use natural movie dialogue phrasing without forcing unnecessary polite particles on short exclamations or emotional lines.
4. Return ONLY the rows matching the [L_x] structure.`;

            const res = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'gpt-4o',
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: chunkText }
                    ],
                    temperature: 0.35
                }),
                signal: signal
            });

            if (!res.ok) {
                throw new Error("OpenAI Engine Failed or API Key is Invalid");
            }

            const data = await res.json();
            
            if (data.choices && data.choices[0]) {
                const reply = data.choices[0].message.content;
                let resultList = new Array(textArray.length).fill("");
                
                const lines = reply.split('\n');
                lines.forEach(function(line) {
                    let match = line.match(/^\[L_(\d+)\]\s*(.*)/);
                    if (match) {
                        let idx = parseInt(match[1]);
                        if (idx < resultList.length) {
                            resultList[idx] = match[2].trim();
                        }
                    }
                });

                for (let k = 0; k < resultList.length; k++) {
                    if (!resultList[k] && textArray[k]) {
                        resultList[k] = "ไม่"; 
                    }
                }
                return restoreTagsAndClean(resultList, metaPairs);
            }
            
            throw new Error("OpenAI Parsing Error: Choice empty");
        }

        // ==========================================
        // 🚀 9. MAIN PROCESSOR & EXECUTION FLOW
        // ==========================================
        btnTranslate.addEventListener('click', async function() {
            if (isTranslating) {
                if (abortController) {
                    abortController.abort();
                }
                return;
            }

            if (!selectedFile) {
                alert("⚠️ กรุณาเลือกไฟล์ซับไตเติลก่อนเริ่มกระบวนการแปลครับ");
                return;
            }

            const engine = uiEngine.value;
            const key = uiKey.value.trim();
            const targetLang = uiLang.value;
            
            if ((engine === 'openai' || engine === 'nvidia_deepseek') && !key) {
                alert(`⚠️ กรุณาใส่ API Key ของ ${engine === 'nvidia_deepseek' ? 'NVIDIA NIM (nvapi-...)' : 'OpenAI'} ก่อนเริ่มกระบวนการแปลครับ`);
                return;
            }

            isTranslating = true;
            abortController = new AbortController();
            
            btnTranslate.textContent = "❌ ยกเลิกการแปล (Cancel)";
            btnTranslate.classList.remove('active');
            btnTranslate.classList.add('cancel-mode');
            statusText.textContent = "กำลังประมวลผล...";

            try {
                const lines = (fileExtension === 'srt' || fileExtension === 'vtt') 
                    ? rawFileContent.split(/\r?\n\r?\n/) 
                    : rawFileContent.split(/\r?\n/);
                    
                let finalBlocks = [];
                // NVIDIA NIM DeepSeek รองรับ Context ได้ยาว ปรับเพิ่มเป็น 25 บรรทัดต่อรอบ
                let chunkSize = (engine === 'nvidia_deepseek') ? 25 : ((engine === 'openai') ? 12 : 15); 
                
                for (let i = 0; i < lines.length; i += chunkSize) {
                    if (abortController.signal.aborted) {
                        throw new DOMException("Aborted", "AbortError");
                    }

                    let batch = lines.slice(i, i + chunkSize);
                    let textArray = [];
                    let meta = [];
                    
                    batch.forEach(function(b) {
                        let trimmed = b.trim();
                        
                        if (trimmed.startsWith('WEBVTT')) {
                            meta.push({ type: 'raw', content: b });
                        }
                        else if (!trimmed) {
                            meta.push({ type: 'empty' });
                        } 
                        else if (fileExtension === 'srt' || fileExtension === 'vtt') {
                            let l = trimmed.split(/\r?\n/);
                            if (l.length >= 3) {
                                meta.push({ type: 'sub', header: l[0], time: l[1] });
                                textArray.push(l.slice(2).join('\n'));
                            } else {
                                meta.push({ type: 'raw', content: b });
                            }
                        } 
                        else if (fileExtension === 'ass' || fileExtension === 'ssa') {
                            if (trimmed.startsWith('Dialogue:')) {
                                let parts = trimmed.split(',');
                                meta.push({ type: 'ass_dialogue', prefix: parts.slice(0, 9).join(',') });
                                textArray.push(parts.slice(9).join(','));
                            } else {
                                meta.push({ type: 'raw', content: b });
                            }
                        } 
                        else {
                            meta.push({ type: 'raw', content: b });
                        }
                    });
                    
                    let translated = [];
                    try {
                        if (engine === 'nvidia_deepseek') {
                            translated = await translateWithNvidia(textArray, targetLang, key, abortController.signal);
                        } else if (engine === 'openai') {
                            translated = await translateWithOpenAI(textArray, targetLang, key, abortController.signal);
                        } else {
                            translated = await translateWithGoogle(textArray, targetLang, key, abortController.signal);
                        }
                    } catch (err) {
                        if (err.name === 'AbortError') throw err;
                        console.error("Critical Intercept - API Error, Fallback Triggered", err);
                        alert(`เกิดข้อผิดพลาดจาก API: ${err.message}\nระบบกำลัง Fallback ไปใช้ Google Free แปลแทนครับ`);
                        translated = await translateWithGoogle(textArray, targetLang, "", abortController.signal); 
                    }

                    let tIdx = 0;
                    meta.forEach(function(m) {
                        if (m.type === 'sub') {
                            finalBlocks.push(`${m.header}\n${m.time}\n${translated[tIdx++] || ""}`);
                        } 
                        else if (m.type === 'ass_dialogue') {
                            finalBlocks.push(`${m.prefix},${translated[tIdx++] || ""}`);
                        } 
                        else if (m.type === 'empty') {
                            finalBlocks.push("");
                        } 
                        else {
                            finalBlocks.push(m.content);
                        }
                    });
                    
                    let pct = Math.min(Math.floor(((i + batch.length) / lines.length) * 100), 100);
                    progressBarFill.style.width = pct + '%';
                    percentageText.textContent = pct + '%';
                    statusText.textContent = `กำลังแปลบรรทัดที่ ${i + batch.length} / ${lines.length}...`;
                    
                    await sleep(10); 
                }
                
                let finalContent = (fileExtension === 'srt' || fileExtension === 'vtt') 
                    ? finalBlocks.join('\n\n') 
                    : finalBlocks.join('\n');
                    
                const blob = new Blob([finalContent], { type: "text/plain;charset=utf-8" });
                saveAs(blob, selectedFile.name.replace(/\.[^/.]+$/, "") + "." + targetLang + "." + fileExtension);
                
                statusText.textContent = "🎉 แปลเสร็จสิ้นและบันทึกไฟล์เรียบร้อยแล้วครับ!";
                percentageText.textContent = "100%";

            } catch (err) {
                if (err.name === 'AbortError') {
                    statusText.textContent = "⚠️ ยกเลิกการแปลเรียบร้อยแล้ว (คุณสามารถเลือกไฟล์ใหม่ได้ทันที)";
                    progressBarFill.style.width = '0%';
                    percentageText.textContent = '0%';
                } else {
                    console.error(err);
                    statusText.textContent = "❌ เกิดข้อผิดพลาดระหว่างกระบวนการแปล";
                }
            } finally {
                isTranslating = false;
                abortController = null;
                btnTranslate.textContent = "เริ่มกระบวนการแปลซับไตเติล";
                btnTranslate.classList.remove('cancel-mode');
                btnTranslate.removeAttribute('disabled');
                btnTranslate.classList.add('active');
            }
        });
    </script>
